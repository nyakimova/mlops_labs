name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  lint-and-dag-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest apache-airflow==2.8.1 mlflow pandas scikit-learn matplotlib joblib pyarrow pyyaml optuna hydra-core

      - name: Lint Python code
        run: |
          flake8 mlops_lab_1/src mlops_lab_1/register_model.py mlops_lab_1/dags --max-line-length=100

      - name: DAG integrity test
        run: |
          python -m pytest mlops_lab_1/tests/test_dag_integrity.py -v

  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build Docker image
        run: |
          docker build -t mlops-lab5 ./mlops_lab_1
