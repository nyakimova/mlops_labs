name: Model CI (Train, Test, Report)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  ci:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mlops_lab_1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: mlops_lab_1/requirements-ci.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Install CML
        run: |
          npm install -g @dvcorg/cml

      - name: Lint
        run: |
          flake8 src tests --count --select=E9,F63,F7,F82,F401 --show-source --statistics --max-line-length=88

      - name: Format check
        run: |
          black src tests --check

      - name: Run tests
        run: |
          pytest tests/test_model.py

      - name: Train model
        run: |
          python src/trainn.py --data_path data/processed/train_prepared.parquet

      - name: Check quality gate
        run: |
          python -c "import json; m=json.load(open('artifacts/metrics.json')); assert m['rmse_test'] <= 20000, f'Quality Gate failed: rmse_test={m[\"rmse_test\"]}'"

      - name: Create CML report
        if: github.event_name == 'pull_request'
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "## Model Metrics" > report.md
          cat artifacts/metrics.json >> report.md
          echo "" >> report.md
          echo "## Feature Importance" >> report.md
          cml publish artifacts/feature_importance.png --md >> report.md
          cml comment create report.md
