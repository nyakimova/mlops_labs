name: Model CI (Train, Test, Report)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  ci:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mlops_lab_1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest flake8 black cml

      - name: Lint with flake8
        run: |
          flake8 src tests --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Check formatting with black
        run: |
          black src tests --check

      - name: Run tests
        run: |
          pytest tests/test_model.py

      - name: Train model
        run: |
          python src/trainn.py --data_path data/processed/train_prepared.parquet

      - name: Check quality gate
        run: |
          python -c "import json; m=json.load(open('artifacts/metrics.json')); assert m['rmse_test'] <= 20000, 'Quality Gate failed'"

      - name: Create CML report
        if: github.event_name == 'pull_request'
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo '## Model Metrics' > report.md
          cat artifacts/metrics.json >> report.md
          echo '' >> report.md
          echo '## Feature Importance' >> report.md
          cml publish artifacts/feature_importance.png --md >> report.md
          cml comment create report.md